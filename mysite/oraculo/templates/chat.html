{% extends "base.html" %}
{% load static %}
{% load permission_tags %}

{% block conteudo %}
    <style>
        .markdown-body {
            line-height: 1.6;
        }
        .markdown-body p {
            margin-bottom: 0.65rem;
        }
        .markdown-body p:last-child {
            margin-bottom: 0;
        }
        .markdown-body strong {
            font-weight: 700;
            color: #111827;
        }
        .markdown-body em {
            font-style: italic;
        }
        .markdown-body h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 0.85rem;
            margin-bottom: 0.4rem;
            color: #111827;
        }
        .markdown-body h2 {
            font-size: 1.125rem;
            font-weight: 700;
            margin-top: 0.75rem;
            margin-bottom: 0.35rem;
            color: #111827;
        }
        .markdown-body h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-top: 0.65rem;
            margin-bottom: 0.3rem;
            color: #111827;
        }
        .markdown-body ul {
            list-style-type: disc;
            margin-left: 1.25rem;
            margin-bottom: 0.65rem;
        }
        .markdown-body ol {
            list-style-type: decimal;
            margin-left: 1.25rem;
            margin-bottom: 0.65rem;
        }
        .markdown-body li {
            margin-bottom: 0.25rem;
        }
        .markdown-body code {
            background-color: rgba(0, 0, 0, 0.08);
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            font-family: monospace;
        }
        .markdown-body pre {
            background-color: #1f2937;
            color: #f9fafb;
            padding: 0.75rem;
            border-radius: 0.375rem;
            overflow-x: auto;
            margin-bottom: 0.65rem;
            font-size: 0.875em;
        }
        .markdown-body blockquote {
            border-left: 3px solid #94a3b8;
            padding-left: 0.75rem;
            color: #475569;
            margin-bottom: 0.65rem;
            font-style: italic;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <main>
        <header class="relative isolate bg-lime-200/80">
            <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
                <div class="mx-auto flex max-w-2xl items-center justify-between gap-x-8 lg:mx-0 lg:max-w-none">
                    <div class="flex items-center gap-x-6">
                        <img src="{% static 'arcane.png' %}" alt="" class="w-1/3">
                        <h1>
                            <div class="text-sm/6 text-gray-500">Upload</div>
                            <div class="mt-1 text-base font-semibold text-gray-900">Chatbot</div>
                        </h1>
                    </div>
                    <div class="flex items-center gap-x-4 sm:gap-x-6">
                        <a href="{% url 'treinar_ia' %}"
                           type="button"
                           class="hidden text-sm/6 font-semibold text-gray-900 sm:block">Treinamento da IA</a>
                        <a href="{% url 'chat' %}"
                           type="button"
                           class="hidden text-sm/6 font-semibold text-gray-900 sm:block">Perguntar</a>
                    </div>
                </div>
            </div>
        </header>
        <div class="px-4 md:px-0">
            <div class="mx-auto bg-slate-50 mt-8 max-w-4xl px-4 py-16 sm:px-6 lg:px-8 border border-slate-200/60 rounded-md">

                <div class="flex flex-col gap-6" id="chat">

                    <div class="flex items-start gap-2.5">
                        <img class="w-12 h-12 rounded-full" src="{% static 'assistente_virtual.png' %}" alt="Jese image">
                        <div class="flex flex-col gap-1 w-full max-w-2xl">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-sm font-semibold text-gray-900">Iazete</span>
                                <span id="hora-inicial" class="text-xs font-normal text-gray-500"></span>
                            </div>
                            <div class="flex flex-col leading-1.5 p-4 border-gray-200 bg-gray-200 rounded-e-xl rounded-es-xl">
                            <p class="text-sm font-normal py-2.5 text-gray-900">
                                Olá, eu sou sua assistente virtual. Como posso ajudar?
                            </p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <div class="px-4 md:px-0">
            <div class="mx-auto bg-slate-50 mt-6 max-w-4xl px-4 py-4 sm:px-6 lg:px-8 border border-slate-200/60 rounded-md">
                <form id="form-pergunta">
                    <div class="flex items-center gap-4">
                        <input 
                        type="text" 
                        name="pergunta"
                        id="pergunta" 
                        placeholder="Digite sua pergunta..." 
                        class="flex-1 border border-slate-300 rounded-md px-4 py-2 text-sm text-gray-800 bg-white"
                        autocomplete="off"
                        >
                        <button type="submit" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                        Enviar
                        </button>
                    </div>
                </form>

            </div>
        </div>

    </main>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const csrftoken = getCookie('csrftoken');

        function getHoraAtual() {
            const agora = new Date();
            return agora.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatMarkdown(text) {
            if (typeof marked !== 'undefined' && marked.parse) {
                return marked.parse(text);
            }
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/^### (.*$)/gim, '<h3 class="font-bold text-base mt-2 mb-1">$1</h3>')
                .replace(/^## (.*$)/gim, '<h2 class="font-bold text-lg mt-3 mb-1">$1</h2>')
                .replace(/^# (.*$)/gim, '<h1 class="font-bold text-xl mt-3 mb-1">$1</h1>')
                .replace(/^\s*[\*\-]\s+(.*$)/gim, '<li class="ml-4 list-disc">$1</li>')
                .replace(/\n\n/g, '<p class="mb-2"></p>')
                .replace(/\n/g, '<br>');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const el = document.getElementById("hora-inicial");
            if (el) {
                el.innerText = getHoraAtual();
            }
        });

        document.getElementById('form-pergunta').addEventListener('submit', async function(event) {
            event.preventDefault();

            const inputPergunta = document.getElementById('pergunta');
            const pergunta = inputPergunta.value.trim();
            if (!pergunta) return;

            inputPergunta.value = '';

            const formData = new FormData();
            formData.append('pergunta', pergunta);

            try {
                const response = await fetch("{% url 'chat' %}", {
                    method: "POST",
                    body: formData,
                });

                const data = await response.json();
                const perguntaId = data.id;

                const horaAtual = getHoraAtual();

                const novaMensagem1 = document.createElement("div");
                novaMensagem1.className = "flex items-start gap-2.5 justify-end";
                novaMensagem1.innerHTML = `
                    <div class="flex flex-col gap-1 w-full max-w-[450px] text-right">
                        <div class="flex items-center justify-end gap-2 mb-1">
                            <span class="text-xs font-normal text-gray-500">${horaAtual}</span>
                            <span class="text-sm font-semibold text-gray-900">Você</span>
                        </div>
                        <div class="flex flex-col leading-1.5 p-4 bg-lime-200 text-gray-900 rounded-s-xl rounded-ee-xl text-left">
                            <p class="text-sm font-normal py-1">
                                ${pergunta}
                            </p>
                        </div>
                    </div>`;

                const chatContainer = document.getElementById("chat");
                chatContainer.appendChild(novaMensagem1);

                const novaMensagem = document.createElement("div");
                novaMensagem.className = "flex items-start gap-2.5";
            
                novaMensagem.innerHTML = `
                    <img class="w-12 h-12 rounded-full flex-shrink-0" src="{% static 'assistente_virtual.png' %}">
                    <div class="flex flex-col gap-1 w-full max-w-2xl">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-sm font-semibold text-gray-900">Iazete</span>
                            <span class="text-xs font-normal text-gray-500">${getHoraAtual()}</span>
                        </div>
                        <div class="p-4 bg-gray-200 rounded-e-xl rounded-es-xl">
                            <div id="resposta-Iazete-${perguntaId}" class="text-sm text-gray-900 markdown-body"></div>
                        </div>
                        <a href="/oraculo/ver_fontes/${perguntaId}" class="text-xs text-indigo-600 hover:underline">
                            Confira as fontes utilizadas
                        </a>
                    </div>
                `;

                chatContainer.appendChild(novaMensagem);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

                const streamResponse = await fetch("{% url 'stream_response' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        "X-CSRFToken": csrftoken,
                    },
                    body: new URLSearchParams({ id_pergunta: perguntaId }),
                });

                const reader = streamResponse.body.getReader();
                const decoder = new TextDecoder("utf-8");
                const respostaElemento = document.getElementById(`resposta-Iazete-${perguntaId}`);

                let textoAcumulado = "";
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    textoAcumulado += chunk;
                    respostaElemento.innerHTML = formatMarkdown(textoAcumulado);
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }

            } catch (error) {
                console.error("Erro:", error);
            }
        });
    </script>
{% endblock %}
